name: Check public contents
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python tools/check_content.py --staged
      - run: python -m unittest discover -s tests -v
